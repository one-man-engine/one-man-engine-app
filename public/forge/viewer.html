<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Forge v2 Viewer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #020617;
        color: #e5e7eb;
      }

      header {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.4);
        background: radial-gradient(circle at top left, #1d4ed8, #020617);
      }

      h1 {
        margin: 0;
        font-size: 20px;
      }

      main {
        display: grid;
        grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
        gap: 0;
        min-height: calc(100vh - 60px);
      }

      @media (max-width: 768px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto;
        }
      }

      .sidebar {
        border-right: 1px solid rgba(148, 163, 184, 0.4);
        padding: 12px 16px;
        overflow-y: auto;
        background: radial-gradient(circle at top left, #020617, #020617);
      }

      .status {
        font-size: 12px;
        opacity: 0.85;
        margin-bottom: 10px;
      }

      ul.jobs {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .job-item {
        padding: 8px 10px;
        margin-bottom: 6px;
        border-radius: 6px;
        border: 1px solid rgba(148, 163, 184, 0.5);
        cursor: pointer;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .job-item:hover {
        background: rgba(37, 99, 235, 0.08);
        border-color: #3b82f6;
      }

      .job-item.active {
        background: rgba(37, 99, 235, 0.16);
        border-color: #60a5fa;
      }

      .job-title {
        font-weight: 500;
      }

      .job-meta {
        opacity: 0.75;
      }

      .content {
        padding: 16px 18px;
        overflow-y: auto;
      }

      .content h2 {
        margin-top: 0;
        font-size: 16px;
      }

      pre {
        background: #020617;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 12px;
        overflow-x: auto;
        border: 1px solid rgba(148, 163, 184, 0.5);
      }

      a.button-link {
        display: inline-block;
        margin-top: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #22c55e;
        text-decoration: none;
        color: #bbf7d0;
        font-size: 12px;
      }

      a.button-link:hover {
        background: rgba(34, 197, 94, 0.2);
      }

      .empty {
        opacity: 0.7;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Forge v2 Build Viewer</h1>
    </header>

    <main>
      <aside class="sidebar">
        <div id="status" class="status">Loading completed builds…</div>
        <ul id="jobs" class="jobs"></ul>
      </aside>

      <section class="content">
        <h2 id="build-title">Select a build</h2>
        <div id="build-meta" class="status"></div>
        <div id="payload"></div>
        <h3>Raw manifest</h3>
        <pre id="manifest-pre" class="empty">No build selected yet.</pre>
      </section>
    </main>

    <script>
      // Same list URL you use in main.js
      const LIST_BUILDS_URL =
        "https://listbuilds-h3nyotr2ca-uc.a.run.app";

      const statusEl = document.getElementById("status");
      const jobsEl = document.getElementById("jobs");
      const manifestPre = document.getElementById("manifest-pre");
      const payloadEl = document.getElementById("payload");
      const buildTitleEl = document.getElementById("build-title");
      const buildMetaEl = document.getElementById("build-meta");

      let currentJobId = null;

      async function loadBuilds() {
        statusEl.textContent = "Loading completed builds…";
        jobsEl.innerHTML = "";

        try {
          const res = await fetch(`${LIST_BUILDS_URL}?status=complete`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const jobs = data.jobs || [];

          if (!jobs.length) {
            statusEl.textContent =
              "No completed builds yet. Run a build from Drew first.";
            return;
          }

          statusEl.textContent = `Showing ${jobs.length} completed builds. Click one to preview.`;

          jobs.forEach((job) => {
            const li = document.createElement("li");
            li.className = "job-item";
            li.dataset.id = job.id;

            const title = document.createElement("div");
            title.className = "job-title";
            title.textContent =
              job.requestedMessage || "Unnamed build";

            const meta = document.createElement("div");
            meta.className = "job-meta";
            meta.textContent = `${job.version || "v2.0"} • ${
              job.status
            } • ${job.createdAt || ""}`;

            li.appendChild(title);
            li.appendChild(meta);

            li.addEventListener("click", () => selectJob(job, li));

            jobsEl.appendChild(li);
          });

          // Auto-select first job
          selectJob(jobs[0], jobsEl.firstChild);
        } catch (err) {
          console.error("Error loading jobs", err);
          statusEl.textContent =
            "Error loading builds. Check console logs.";
        }
      }

      function selectJob(job, liEl) {
        // Highlight selection
        [...jobsEl.children].forEach((el) =>
          el.classList.remove("active")
        );
        if (liEl) liEl.classList.add("active");

        currentJobId = job.id;
        buildTitleEl.textContent =
          job.requestedMessage || "Selected build";
        buildMetaEl.textContent = `ID: ${job.id} • Status: ${
          job.status
        }`;

        // Show manifest JSON
        manifestPre.classList.remove("empty");
        manifestPre.textContent = JSON.stringify(job, null, 2);

        // Show payload link if present
        payloadEl.innerHTML = "";
        if (job.payloadHttpUrl) {
          const link = document.createElement("a");
          link.href = job.payloadHttpUrl;
          link.target = "_blank";
          link.className = "button-link";
          link.textContent = "Open build payload";
          payloadEl.appendChild(link);
        } else {
          const div = document.createElement("div");
          div.className = "empty";
          div.textContent =
            "This build does not have a payload URL yet.";
          payloadEl.appendChild(div);
        }
      }

      loadBuilds();
    </script>
  </body>
</html>
