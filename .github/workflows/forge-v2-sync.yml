name: Forge v2 Pipeline

on:
  repository_dispatch:
    types: [forge_v2_complete]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show payload
        run: |
          echo "Job: ${{ github.event.client_payload.jobId }}"
          echo "Version: ${{ github.event.client_payload.version }}"
          echo "Manifest: ${{ github.event.client_payload.payloadHttpUrl }}"

      - name: Prepare latest folder
        run: mkdir -p public/forge/latest

      - name: Download manifest.json
        run: |
          curl -L -o public/forge/latest/manifest.json "${{ github.event.client_payload.payloadHttpUrl }}"
          echo "Downloaded manifest:"
          cat public/forge/latest/manifest.json

      - name: Verify viewer exists
        run: test -f public/forge/viewer.html

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.PROJECT_ID }}
          channelId: live
   
      - name: Set environment variables
        run: |
          echo "FIREBASE_CLI_EXPERIMENTS=webframeworks" >> $GITHUB_ENV
          echo "NODE_VERSION=20" >> $GITHUB_ENV
