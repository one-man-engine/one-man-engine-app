name: Forge Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:
  repository_dispatch:
    types: [forge_sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull latest build manifest
        run: |
          mkdir -p forge/sync
          curl -L "https://firebasestorage.googleapis.com/v0/b/onemanengine-9c23b.appspot.com/o/forge%2Fv2%2FREADY.txt?alt=media" -o forge/sync/READY.txt
          echo "✅ Synced latest Forge marker"

      - name: Auto trigger Firebase Deploy
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project onemanengine-9c23b
