name: Forge Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:
  repository_dispatch:
    types: [forge_sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - # (Optional marker so we can wire the vault later)
      - name: Pull latest build marker
        run: |
          mkdir -p forge/sync
          gsutil cp gs://onemanengine-9c23b.appspot.com/forge/v2/READY.txt forge/sync/READY.txt || echo "No marker yet"

      - name: Deploy web
        run: |
          npm i -g firebase-tools
          firebase deploy --only hosting --project onemanengine-9c23b --non-interactive
