name: Forge Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *'     # every 15 minutes
  workflow_dispatch:
  repository_dispatch:
    types: [forge_sync]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (we won't use its web, just need a workspace)
        uses: actions/checkout@v4

      - name: Set up Node (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      # --- auth to Google so we can use gsutil to pull from your bucket ---
      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: '>= 463.0.0'

      - name: Authenticate gcloud with service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONEMANENGINE_9C23B }}

      - name: Enable gsutil
        run: gcloud components install gsutil --quiet

      # --- pull LATEST vault build marker + web.zip ---
      - name: Read latest stamp
        run: |
          mkdir -p forge/sync
          gsutil cp gs://onemanengine-9c23b.appspot.com/exports/latest.txt forge/sync/latest.txt
          echo "STAMP=$(cat forge/sync/latest.txt)" >> $GITHUB_ENV

      - name: Download web.zip for ${{ env.STAMP }}
        run: |
          gsutil cp gs://onemanengine-9c23b.appspot.com/exports/${STAMP}/web.zip forge/sync/web.zip
          ls -l forge/sync

      - name: Unzip into web/
        run: |
          mkdir -p web
          unzip -o forge/sync/web.zip -d web
          ls -la web

      # --- deploy that web/ to Firebase Hosting ---
      - name: Deploy to Firebase Hosting (vault build)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          # write firebase.json that points "public" to ./web
          cat > firebase.json <<'EOF'
          {
            "hosting": {
              "public": "web",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "cleanUrls": true,
              "rewrites": [{"source": "**", "destination": "/index.html"}]
            }
          }
          EOF

          firebase deploy --only hosting --project onemanengine-9c23b --non-interactive
