name: Forge Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:
  repository_dispatch:
    types: [forge_sync]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Show Flutter/Dart versions
        run: |
          flutter --version
          dart --version

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter web (release)
        run: flutter build web --release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Write your service account key from a GitHub Secret
      # (Settings → Secrets → Actions → FIREBASE_SERVICE_ACCOUNT)
      - name: Write Firebase service account key
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > $GITHUB_WORKSPACE/firebase-key.json

      # Minimal hosting config that points to the Flutter web build
      - name: Write firebase.json
        run: |
          cat > $GITHUB_WORKSPACE/firebase.json << 'EOF'
          {
            "hosting": {
              "public": "build/web",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "cleanUrls": true,
              "rewrites": [{"source": "**", "destination": "/index.html"}],
              "headers": [
                {"source": "index.html", "headers": [{"key": "Cache-Control", "value": "no-cache"}]}
              ]
            }
          }
          EOF

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-key.json
        run: |
          firebase deploy --only hosting --project onemanengine-9c23b --non-interactive
