name: Build & Deploy Web to Firebase Hosting

on:
  push:
    branches: [ "flutterflow" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.0'

      - name: Show Flutter/Dart versions
        run: |
          flutter --version
          dart --version

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter web (release)
        run: flutter build web --release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write Firebase service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $GITHUB_WORKSPACE/firebase_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/firebase_key.json" >> $GITHUB_ENV

      - name: Write firebase.json
        run: |
          cat > $GITHUB_WORKSPACE/firebase.json << 'EOF'
          {
            "hosting": {
              "public": "build/web",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "cleanUrls": true,
              "rewrites": [{ "source": "**", "destination": "/index.html" }],
              "headers": [
                { "source": "index.html",
                  "headers": [{ "key": "Cache-Control", "value": "no-cache" }]
                }
              ]
            }
          }
          EOF
          echo "firebase.json written:"
          cat $GITHUB_WORKSPACE/firebase.json

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: |
          firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
