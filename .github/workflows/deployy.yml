name: build-and-deploy

on:
  push:
    branches: ["flutterflow"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.0

      - name: Show Flutter/Dart versions
        run: |
          flutter --version
          dart --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter web (release)
        run: flutter build web --release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write Firebase service account key
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $GITHUB_WORKSPACE/firebase_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/firebase_key.json" >> $GITHUB_ENV

      - name: Verify firebase config files
        working-directory: ${{ github.workspace }}
        run: |
          echo "CWD: $(pwd)"
          ls -la
          echo "---- firebase.json ----"
          cat firebase.json
          echo "---- .firebaserc ----"
          cat .firebaserc

      - name: Deploy to Firebase Hosting
        working-directory: ${{ github.workspace }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase_key.json
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
        run: |
          firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
