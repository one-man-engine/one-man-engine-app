name: Forge v2 Pipeline

on:
  repository_dispatch:
    types: [forge_v2_complete]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------- Build Flutter Web ----------
      - name: Set up Java (for Flutter)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release

      # ---------- Stage build into public/ ----------
      - name: Prepare public folder
        run: |
          rm -rf public
          mkdir -p public
          cp -R build/web/* public/

      # (Optional) keep any Forge payload/viewer assets
      # - name: Copy Forge viewer/payload (if you have them)
      #   run: cp -R viewer/* public/ || true

      # ---------- Deploy to Firebase Hosting (live) ----------
      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONEMANENGINE }}"
          projectId: onemanengine-9c23b
          channelId: live
          entryPoint: .
